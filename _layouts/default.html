<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  {% include head.html %}
  {% if page.interactif %}{% include interactif.html %}{% endif %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="site-brand">
        <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>
        <span class="site-sub">{{ site.subtitle }}</span>
      </div>
      <nav class="site-nav">
        <a href="{{ site.baseurl }}/">Accueil</a>
        <a href="{{ site.baseurl }}/cours/">Cours</a>
      </nav>
    </div>
  </header>
  <main class="page-content">
    <div class="wrap">
      {{ content }}
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>{{ site.title }}</p>
    </div>
  </footer>
</body>
</html>
